# Runs on staged files before each commit. Install with `just init`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && pnpm exec prettier --write "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|css|json|md|html)$
      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && pnpm exec eslint --fix "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx)$
