services:
  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      API_TOKEN: ${API_TOKEN:-dev-token}
      STATE_DIR: /state
      # Only needed once, to bring projects from before they became self-contained folders (a folder
      # holding one sub-folder per project) in; it must be inside EDITH_MOUNT. Leave empty otherwise.
      LEGACY_LIBRARY_DIR: ${LEGACY_LIBRARY_DIR:-}
    ports:
      - "8000:8000"
    # Projects are folders anywhere on your machine. Everything under EDITH_MOUNT is visible to Edith,
    # mounted at the SAME path as on the host so that file paths in exports are your real ones.
    # (Point it at your home folder, or at /Volumes for external drives.)
    volumes:
      - ${EDITH_MOUNT:-${HOME}}:${EDITH_MOUNT:-${HOME}}
      - state:/state

  web:
    build:
      context: ./frontend
      args:
        VITE_API_TOKEN: ${API_TOKEN:-dev-token}
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  state: # the recent-projects list
