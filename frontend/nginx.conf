server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: /api/x -> backend /x.
    location /api/ {
        proxy_pass http://api:8000/;
        client_max_body_size 50m;
    }

    # SPA fallback: unknown routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
